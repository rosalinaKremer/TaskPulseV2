# Render Blueprint: Dashboard > New > Blueprint, pick this repo.
# Creates the Django API. The database is MongoDB Atlas (set MONGODB_URI).
services:
  - type: web
    name: taskpulse-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      # MongoDB Atlas connection string, e.g. mongodb+srv://user:pass@cluster0.xxxxx.mongodb.net/
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_NAME
        value: taskpulse
      # Set to your Vercel URL after the frontend is deployed, e.g. https://taskpulse.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
